<html lang="pt-BR">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --primary:#1e40af;--primary-light:#3b82f6;--primary-dark:#0f2d5f;
  --danger:#dc2626;--warning:#f59e0b;--success:#10b981;
  --gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-300:#d1d5db;
  --gray-400:#9ca3af;--gray-500:#6b7280;--gray-700:#374151;--gray-800:#1f2937;--gray-900:#111827;
  --shadow-md:0 3px 6px rgba(0,0,0,.15),0 2px 4px rgba(0,0,0,.12);
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--gray-50);color:var(--gray-900);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden;}
.container{width:100%;height:100vh;display:flex;flex-direction:column;background:#fff;}
.header{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);color:#fff;padding:14px 16px;box-shadow:var(--shadow-md);position:sticky;top:0;z-index:100;}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.header-title{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;}
.header-badge{background:rgba(255,255,255,.2);padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600;}
.stats{display:flex;gap:14px;font-size:13px;align-items:center;}
.stat{display:flex;align-items:center;gap:5px;}
.stat-number{font-weight:700;font-size:15px;}
.conflict-badge{background:var(--danger);color:#fff;padding:3px 9px;border-radius:10px;font-size:11px;font-weight:700;}
.nav-tabs{display:flex;border-bottom:1px solid var(--gray-200);background:#fff;}
.nav-tab{flex:1;padding:12px;text-align:center;border:none;background:transparent;color:var(--gray-500);font-size:14px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;transition:.2s;}
.nav-tab.active{color:var(--primary);border-bottom-color:var(--primary);}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:70px;}
.view{display:none;}
.view.active{display:block;}
.day-selector{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 16px;}
.day-btn{padding:10px 4px;border:2px solid var(--gray-300);border-radius:10px;background:#fff;cursor:pointer;text-align:center;transition:.15s;}
.day-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.day-btn .dlabel{font-size:10px;opacity:.8;}
.day-btn .dnum{font-size:16px;font-weight:800;}
.filters{padding:8px 16px;background:var(--gray-50);display:flex;gap:8px;}
.filter-input{flex:1;padding:10px 14px;border:1px solid var(--gray-300);border-radius:10px;font-size:14px;background:#fff;}
.chips-row{padding:4px 16px 10px;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.chips-row::-webkit-scrollbar{display:none;}
.filter-chip{padding:7px 12px;background:#fff;border:1px solid var(--gray-300);border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s;color:var(--gray-700);flex-shrink:0;}
.filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.sessions-list{padding:8px 12px;}
.time-group{margin-bottom:20px;}
.time-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:0 4px;}
.time-label{font-weight:800;color:var(--primary);font-size:14px;white-space:nowrap;}
.time-divider{flex:1;height:2px;background:linear-gradient(90deg,var(--primary),transparent);}
.session-card{background:#fff;border:1.5px solid var(--gray-300);border-radius:12px;padding:12px;margin-bottom:9px;cursor:pointer;transition:.15s;position:relative;}
.session-card.favorited{border-color:var(--primary);background:linear-gradient(135deg,rgba(30,64,175,.06) 0%,rgba(59,130,246,.06) 100%);border-width:2px;}
.session-card.conflict{border-color:var(--danger);background:linear-gradient(135deg,rgba(220,38,38,.06) 0%,rgba(239,68,68,.06) 100%);}
.session-badge{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--gray-100);color:var(--gray-400);font-size:15px;}
.session-card.favorited .session-badge{background:var(--primary);color:#fff;}
.session-card.conflict .session-badge{background:var(--danger);color:#fff;}
.session-type{display:inline-block;font-size:10px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
.session-title{font-weight:700;font-size:14px;color:var(--gray-900);line-height:1.35;padding-right:30px;margin-bottom:8px;}
.session-specs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px;}
.spec-tag{background:var(--primary-light);color:#fff;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:600;}
.price-tag{background:var(--warning);color:#fff;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;}
.sponsor-tag{background:#8b5cf6;color:#fff;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;}
.session-card.sponsored{border-color:#8b5cf6;border-style:dashed;}
.session-card.sponsored.favorited{border-style:solid;}
.session-meta{font-size:12px;color:var(--gray-500);}
.badge-warning{background:var(--warning);color:#fff;padding:5px 9px;border-radius:6px;font-size:11px;font-weight:700;margin-top:8px;display:inline-block;}
.details-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:200;}
.details-modal.active{display:flex;}
.details-content{width:100%;background:#fff;border-radius:18px 18px 0 0;padding:20px 16px 24px;max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch;animation:slideUp .25s ease-out;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.details-close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:var(--gray-100);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--gray-700);}
.details-header{margin-bottom:14px;padding-right:36px;}
.details-time{font-size:13px;color:var(--primary);font-weight:700;margin-bottom:6px;}
.details-title{font-size:17px;font-weight:800;color:var(--gray-900);line-height:1.4;}
.details-section{margin-bottom:14px;}
.details-section-title{font-size:11px;font-weight:800;color:var(--gray-500);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.details-section-content{font-size:14px;color:var(--gray-700);line-height:1.55;}
.speaker-item{padding:7px 0;border-bottom:1px solid var(--gray-200);}
.speaker-item:last-child{border-bottom:none;}
.speaker-name{font-weight:700;color:var(--gray-900);font-size:13px;}
.speaker-role{font-size:11px;color:var(--gray-500);}
.agenda-item{padding:10px 0;border-bottom:1px solid var(--gray-200);}
.agenda-item:last-child{border-bottom:none;}
.agenda-item-row{display:flex;align-items:flex-start;gap:8px;}
.agenda-item.agenda-item-fav{background:rgba(30,64,175,.06);margin:0 -8px;padding:10px 8px;border-radius:8px;border-bottom-color:transparent;}
.item-star{flex-shrink:0;width:34px;height:34px;border-radius:50%;border:none;background:var(--gray-100);color:var(--gray-400);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.item-star.active{background:var(--primary);color:#fff;}
.agenda-time{font-size:11px;font-weight:800;color:var(--primary);margin-bottom:3px;}
.agenda-topic{font-size:13.5px;font-weight:700;color:var(--gray-900);line-height:1.35;margin-bottom:4px;}
.agenda-speakers{font-size:11.5px;color:var(--gray-500);line-height:1.5;}
.agenda-speakers b{color:var(--gray-700);font-weight:600;}
.details-button{width:100%;padding:14px;margin-top:6px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;background:var(--primary);color:#fff;}
.details-button.favorited{background:var(--danger);}
.agenda-empty{text-align:center;padding:50px 20px;color:var(--gray-500);}
.agenda-empty-icon{font-size:44px;margin-bottom:10px;}
.day-block{padding:14px 12px 4px;}
.day-block-title{font-size:13px;font-weight:800;color:var(--primary);margin-bottom:10px;padding:0 4px;text-transform:uppercase;letter-spacing:.3px;}
.conflict-title{font-size:12px;font-weight:800;color:var(--danger);margin:6px 4px 8px;}
.conflict-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.conflict-card{background:#fff;border:2px solid var(--danger);border-radius:10px;padding:10px;position:relative;}
.conflict-label{position:absolute;top:-9px;left:10px;background:#fff;color:var(--danger);font-size:10px;font-weight:800;padding:0 6px;text-transform:uppercase;}
.conflict-time{font-size:11px;color:var(--gray-500);font-weight:700;margin-top:6px;margin-bottom:4px;}
.remove-btn{width:100%;padding:7px;margin-top:8px;background:var(--gray-100);border:none;border-radius:6px;font-size:11px;cursor:pointer;color:var(--danger);font-weight:700;}
.footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--gray-200);padding:6px 0;display:flex;justify-content:space-around;z-index:100;}
.footer-btn{flex:1;padding:8px;border:none;background:transparent;color:var(--gray-500);cursor:pointer;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;}
.footer-btn.active{color:var(--primary);}
.footer-icon{font-size:19px;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--gray-100);}
::-webkit-scrollbar-thumb{background:var(--gray-400);border-radius:3px;}
@media (prefers-color-scheme: dark){
  body{background:#0f1115;color:var(--gray-50);}
  .container,.nav-tabs,.footer{background:#1a1d24;}
  .session-card{background:#20242c;border-color:#333844;}
  .session-card.favorited{background:linear-gradient(135deg,rgba(59,130,246,.15) 0%,rgba(30,64,175,.15) 100%);}
  .session-title,.details-title{color:#f3f4f6;}
  .filter-input,.day-btn,.filter-chip{background:#20242c;border-color:#333844;color:#f3f4f6;}
  .details-content{background:#1a1d24;}
  .details-close{background:#333844;}
  .speaker-item{border-bottom-color:#333844;}
  .agenda-item{border-bottom-color:#333844;}
  .agenda-item.agenda-item-fav{background:rgba(59,130,246,.15);}
  .item-star{background:#333844;color:#9ca3af;}
  .agenda-topic{color:#f3f4f6;}
  .agenda-speakers b{color:#d1d5db;}
  .conflict-card{background:#20242c;}
  .remove-btn{background:#333844;}
  .filters{background:#0f1115;}
  .time-label{color:#60a5fa;}
}
</style>
</head>

(function migrate(){
  if(state.favorites.length===0){
    const old = JSON.parse(localStorage.getItem('cbo2026_favorites_v2')||'[]');
    if(old.length>0){ state.favorites = old.slice(); localStorage.setItem('cbo2026_favorites_v3', JSON.stringify(state.favorites)); }

function getSessionsForDay(dayKey){
  return SESSIONS.filter(s=>s.day===dayKey).sort((a,b)=>a.startTime-b.startTime);
}
function getAllSpecialties(){
  const set = new Set();
  SESSIONS.forEach(s=>s.specialties.forEach(sp=>set.add(sp)));
  return Array.from(set).sort();
}
function findSession(id){ return SESSIONS.find(s=>s.id===id); }

function parseTimeRange(t){
  const [a,b] = t.split(' - ');
  const [ah,am] = a.split(':').map(Number);
  const [bh,bm] = b.split(':').map(Number);
  return { startTime: ah*100+am, endTime: bh*100+bm };
}

// A "favId" is either "sessionId" (whole block) or "sessionId#itemIndex" (single talk within a block's agenda)
function parseFavId(favId){
  const hashIdx = favId.indexOf('#');
  if(hashIdx===-1) return { sessionId: favId, itemIndex: null };
  return { sessionId: favId.slice(0,hashIdx), itemIndex: parseInt(favId.slice(hashIdx+1),10) };
}
function getFavEntry(favId){
  const { sessionId, itemIndex } = parseFavId(favId);
  const s = findSession(sessionId);
  if(!s) return null;
  if(itemIndex===null){
    return { favId, session: s, item: null, day: s.day, room: s.room, title: s.title,
              time: s.time, startTime: s.startTime, endTime: s.endTime, specialties: s.specialties };
  }
  const item = s.agenda && s.agenda[itemIndex];
  if(!item) return null;
  const { startTime, endTime } = parseTimeRange(item.time);
  return { favId, session: s, item, itemIndex, day: s.day, room: s.room,
            title: item.title, time: item.time, startTime, endTime, specialties: s.specialties };
}

function conflictType(a,b){
  if(a.startTime===b.startTime && a.endTime===b.endTime) return 'total';
  const overlap = !(a.endTime<=b.startTime || a.startTime>=b.endTime);
  return overlap ? 'parcial' : null;
}

function getConflicts(favId){
  const entry = getFavEntry(favId);
  if(!entry) return [];
  return state.favorites.filter(otherId=>{
    if(otherId===favId) return false;
    const other = getFavEntry(otherId);
    if(!other || other.day!==entry.day) return false;
    return conflictType(entry, other)!==null;
  });
}

// Conflicts touching a whole session (used for the browse card, considering both
// a session-level favorite AND any item-level favorites that belong to a DIFFERENT session)
function getConflictsForSession(sessionId){
  if(state.favorites.includes(sessionId)) return getConflicts(sessionId);
  // if not favorited as a whole, but has favorited items inside, check each item's conflicts
  const itemFavIds = state.favorites.filter(f=>f.startsWith(sessionId+'#'));
  let all = [];
  itemFavIds.forEach(f=>{ all = all.concat(getConflicts(f).filter(o=>!o.startsWith(sessionId+'#') && o!==sessionId)); });
  return all;
}

function countTotalConflictPairs(){
  let pairs = new Set();
  state.favorites.forEach(id1=>{
    getConflicts(id1).forEach(id2=>{
      const key = [id1,id2].sort().join('|');
      pairs.add(key);
    });
  });
  return pairs.size;
}

function toggleFavorite(id){
  const idx = state.favorites.indexOf(id);
  if(idx===-1) state.favorites.push(id); else state.favorites.splice(idx,1);
  saveFavorites();
  render();
}
function toggleItemFavorite(sessionId, itemIndex){
  toggleFavorite(sessionId+'#'+itemIndex);
  showDetails(sessionId); // refresh modal in place
}
function updateStats(){
  document.getElementById('favoriteCount').textContent = state.favorites.length;
  const c = countTotalConflictPairs();
  const stat = document.getElementById('conflictStat');
  if(c>0){ stat.style.display='flex'; document.getElementById('conflictCount').textContent=c; }
  else stat.style.display='none';
}

function renderDaySelector(){
  const el = document.getElementById('daySelector');
  el.innerHTML = DAYS.map((d,i)=>`
    <button class="day-btn ${i===state.selectedDay?'active':''}" onclick="selectDay(${i})">
      <div class="dlabel">${d.label}</div>
      <div class="dnum">${d.num}</div>
    </button>`).join('');
}

function renderSpecialtyFilter(){
  const el = document.getElementById('specialtyFilter');
  const specs = getAllSpecialties();
  el.innerHTML = specs.map(sp=>`
    <button class="filter-chip ${state.selectedSpecialties.includes(sp)?'active':''}" onclick="toggleSpecialty('${sp.replace(/'/g,"\\'")}')">${sp}</button>
  `).join('');
}

function matchesFilters(s){
  if(state.searchTerm){
    const t = state.searchTerm.toLowerCase();
    const agendaText = (s.agenda||[]).map(a=>a.title+' '+(a.speakers||[]).map(x=>x.name).join(' ')).join(' ');
    const hay = (s.title+' '+s.specialties.join(' ')+' '+s.speakers.map(x=>x.name).join(' ')+' '+s.room+' '+agendaText).toLowerCase();
    if(!hay.includes(t)) return false;
  }
  if(state.selectedSpecialties.length>0){
    if(!s.specialties.some(sp=>state.selectedSpecialties.includes(sp))) return false;
  }
  return true;
}

function renderSessions(){
  const container = document.getElementById('sessionsList');
  const dayKey = DAYS[state.selectedDay].key;
  let sessions = getSessionsForDay(dayKey).filter(matchesFilters);

  if(sessions.length===0){
    container.innerHTML = '<div style="text-align:center;padding:40px 16px;color:var(--gray-500);">Nenhuma atividade encontrada com esses filtros.</div>';
    return;
  }

  const grouped = {};
  sessions.forEach(s=>{
    if(!grouped[s.time]) grouped[s.time]=[];
    grouped[s.time].push(s);
  });

  container.innerHTML = Object.entries(grouped).map(([time, list])=>`
    <div class="time-group">
      <div class="time-header"><div class="time-label">${time}</div><div class="time-divider"></div></div>
      ${list.map(s=>renderCard(s)).join('')}
    </div>
  `).join('');
}

function renderCard(s){
  const isFullFav = state.favorites.includes(s.id);
  const favItemCount = state.favorites.filter(f=>f.startsWith(s.id+'#')).length;
  const isPartialFav = !isFullFav && favItemCount>0;
  const conflicts = getConflictsForSession(s.id);
  const hasConflict = (isFullFav||isPartialFav) && conflicts.length>0;
  const isSponsored = s.type==='SIMPÓSIO PATROCINADO';
  let badge = '&#9734;';
  if(isFullFav) badge = '&#9733;';
  else if(isPartialFav) badge = `<span style="font-size:10px;">${favItemCount}</span>`;
  return `
    <div class="session-card ${isFullFav?'favorited':''} ${isPartialFav?'favorited':''} ${hasConflict?'conflict':''} ${isSponsored?'sponsored':''}" onclick="showDetails('${s.id}')">
      <div class="session-badge">${badge}</div>
      <div class="session-type">${s.type||''}${isPartialFav?' &middot; '+favItemCount+' palestra'+(favItemCount>1?'s':'')+' favoritada'+(favItemCount>1?'s':''):''}</div>
      <div class="session-title">${s.title}</div>
      <div class="session-specs">
        ${s.specialties.map(sp=>`<span class="spec-tag">${sp}</span>`).join('')}
        ${s.price?`<span class="price-tag">${s.price}</span>`:''}
        ${isSponsored?`<span class="sponsor-tag">Patrocinado</span>`:''}
      </div>
      <div class="session-meta">&#128205; ${s.room}</div>
      ${hasConflict?`<div class="badge-warning">&#9888;&#65039; CONFLITO com outra favorita</div>`:''}
    </div>`;
}

function showDetails(id){
  state.detailedSessionId = id;
  const s = findSession(id);
  const modal = document.getElementById('detailsModal');
  const content = document.getElementById('detailsContent');
  const isFav = state.favorites.includes(id);
  const conflicts = getConflicts(id);
  const hasAgenda = s.agenda && s.agenda.length>1;

  content.innerHTML = `
    <button class="details-close" onclick="closeDetails()">&#10005;</button>
    <div class="details-header">
      <div class="details-time">${s.date} &middot; ${s.time}</div>
      <div class="details-title">${s.title}</div>
    </div>
    ${s.description?`<div class="details-section"><div class="details-section-title">Sobre</div><div class="details-section-content">${s.description}</div></div>`:''}
    <div class="details-section">
      <div class="details-section-title">Especialidades</div>
      <div class="details-section-content" style="display:flex;gap:6px;flex-wrap:wrap;">
        ${s.specialties.map(sp=>`<span class="spec-tag">${sp}</span>`).join('')}
        ${s.price?`<span class="price-tag">${s.price}</span>`:''}
      </div>
    </div>
    <div class="details-section">
      <div class="details-section-title">Local</div>
      <div class="details-section-content">&#128205; ${s.room}</div>
    </div>
    ${s.speakers.length>0?`
    <div class="details-section">
      <div class="details-section-title">${hasAgenda?'Coordena&ccedil;&atilde;o / Modera&ccedil;&atilde;o':'Palestrantes / Coordena&ccedil;&atilde;o'}</div>
      <div class="details-section-content">
        ${s.speakers.map(sp=>`<div class="speaker-item"><div class="speaker-name">${sp.name}</div><div class="speaker-role">${sp.role}</div></div>`).join('')}
      </div>
    </div>`:''}
    ${hasAgenda?`
    <div class="details-section">
      <div class="details-section-title">Programa&ccedil;&atilde;o da sess&atilde;o (${s.agenda.length} temas) &middot; toque na estrela pra favoritar s&oacute; aquele tema</div>
      <div class="details-section-content">
        ${s.agenda.map((a,idx)=>{
          const itemFavId = s.id+'#'+idx;
          const itemFav = state.favorites.includes(itemFavId);
          const itemConf = getConflicts(itemFavId);
          return `
          <div class="agenda-item ${itemFav?'agenda-item-fav':''}">
            <div class="agenda-item-row">
              <div style="flex:1;">
                <div class="agenda-time">${a.time}</div>
                <div class="agenda-topic">${a.title}</div>
                ${a.speakers && a.speakers.length>0?`<div class="agenda-speakers">${a.speakers.map(sp=>`<b>${sp.name}</b> (${sp.role})`).join(' &middot; ')}</div>`:''}
                ${itemFav && itemConf.length>0?`<div class="badge-warning" style="margin-top:6px;">&#9888;&#65039; Conflito</div>`:''}
              </div>
              <button class="item-star ${itemFav?'active':''}" onclick="event.stopPropagation();toggleItemFavorite('${s.id}',${idx})">${itemFav?'&#9733;':'&#9734;'}</button>
            </div>
          </div>
        `;}).join('')}
      </div>
    </div>`:''}
    ${conflicts.length>0?`<div class="badge-warning">&#9888;&#65039; Conflita com ${conflicts.length} outra${conflicts.length>1?'s':''} favorita${conflicts.length>1?'s':''} no mesmo per&iacute;odo</div>`:''}
    <button class="details-button ${isFav?'favorited':''}" onclick="toggleFavoritFromDetails()">
      ${isFav?'&#9733; Remover sess&atilde;o inteira dos favoritos':'&#9734; Favoritar sess&atilde;o inteira'}
    </button>`;
  modal.classList.add('active');
}
function closeDetails(){ document.getElementById('detailsModal').classList.remove('active'); state.detailedSessionId=null; }
function toggleFavoritFromDetails(){ if(state.detailedSessionId){ toggleFavorite(state.detailedSessionId); showDetails(state.detailedSessionId); } }

function selectDay(i){ state.selectedDay=i; render(); }
function toggleSpecialty(sp){
  const idx = state.selectedSpecialties.indexOf(sp);
  if(idx===-1) state.selectedSpecialties.push(sp); else state.selectedSpecialties.splice(idx,1);
  render();
}

function switchTab(tab){
  document.querySelectorAll('.nav-tab,.footer-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.getElementById('browseView').classList.toggle('active', tab==='browse');
  document.getElementById('agendaView').classList.toggle('active', tab==='agenda');
  if(tab==='agenda') renderAgenda(); else render();
}

function renderAgenda(){
  const container = document.getElementById('agendaContent');
  if(state.favorites.length===0){
    container.innerHTML = `<div class="agenda-empty"><div class="agenda-empty-icon">&#128203;</div><p>Nenhuma palestra favoritada ainda</p><p style="font-size:12px;margin-top:8px;">Volte &agrave; Programa&ccedil;&atilde;o e toque na estrela das palestras que voc&ecirc; quer assistir &mdash; da sess&atilde;o inteira ou s&oacute; de um tema espec&iacute;fico.</p></div>`;
    return;
  }
  let html = '';
  DAYS.forEach(d=>{
    const entries = state.favorites
      .map(favId=>getFavEntry(favId))
      .filter(e=>e && e.day===d.key)
      .sort((a,b)=>a.startTime-b.startTime);
    if(entries.length===0) return;
    html += `<div class="day-block"><div class="day-block-title">${d.key} &middot; ${d.date}</div>`;

    const byTime = {};
    entries.forEach(e=>{ const k=e.startTime+'-'+e.endTime; if(!byTime[k]) byTime[k]=[]; byTime[k].push(e); });

    // group entries that overlap each other into conflict clusters, and standalone ones separately
    const handled = new Set();
    entries.forEach(e=>{
      if(handled.has(e.favId)) return;
      const conflictingIds = getConflicts(e.favId);
      if(conflictingIds.length===0){
        handled.add(e.favId);
        html += renderAgendaCard(e);
      } else {
        // gather full cluster (e + all its conflicts) once
        const clusterIds = new Set([e.favId, ...conflictingIds]);
        clusterIds.forEach(id=>handled.add(id));
        const clusterEntries = Array.from(clusterIds).map(id=>getFavEntry(id)).filter(Boolean)
          .sort((a,b)=>a.startTime-b.startTime);
        html += `<div class="conflict-title">&#9888;&#65039; CONFLITO</div><div class="conflict-pair">`;
        clusterEntries.forEach(ce=>{
          html += `
            <div class="conflict-card">
              <div class="conflict-label">Conflito</div>
              <div class="conflict-time">${ce.time}</div>
              <div class="session-title" style="font-size:12.5px;padding-right:0;">${ce.title}</div>
              ${ce.item?`<div class="session-meta" style="font-size:10px;margin-bottom:4px;">dentro de: ${ce.session.title.substring(0,40)}${ce.session.title.length>40?'&hellip;':''}</div>`:''}
              <div class="session-specs">${ce.specialties.map(sp=>`<span class="spec-tag" style="font-size:9px;">${sp}</span>`).join('')}</div>
              <button class="remove-btn" onclick="toggleFavorite('${ce.favId}');renderAgenda();">&#10005; Remover</button>
            </div>`;
        });
        html += `</div>`;
      }
    });
    html += `</div>`;
  });
  container.innerHTML = html || `<div class="agenda-empty"><div class="agenda-empty-icon">&#128203;</div><p>Nenhuma palestra favoritada ainda</p></div>`;
}

function renderAgendaCard(e){
  return `
    <div class="session-card favorited">
      <div class="session-badge">&#9733;</div>
      <div class="session-type">${e.time}${e.item?' &middot; tema espec&iacute;fico':''}</div>
      <div class="session-title">${e.title}</div>
      ${e.item?`<div class="session-meta" style="margin-bottom:6px;">dentro de: ${e.session.title.substring(0,50)}${e.session.title.length>50?'&hellip;':''}</div>`:''}
      <div class="session-specs">${e.specialties.map(sp=>`<span class="spec-tag">${sp}</span>`).join('')}</div>
      <div class="session-meta">&#128205; ${e.room}</div>
      <button class="remove-btn" onclick="toggleFavorite('${e.favId}');renderAgenda();">&#10005; Remover</button>
    </div>`;
}

function render(){
  renderDaySelector();
  renderSpecialtyFilter();
  renderSessions();
  updateStats();
}

document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('searchInput').addEventListener('input', e=>{
    state.searchTerm = e.target.value;
    render();
  });
  document.querySelectorAll('.nav-tab,.footer-btn').forEach(b=>{
    b.addEventListener('click', ()=>switchTab(b.dataset.tab));
  });
  document.getElementById('detailsModal').addEventListener('click', e=>{
    if(e.target.id==='detailsModal') closeDetails();
  });
  render();
});
</script>
</body>
</html>
